<!DOCTYPE html>
<html>
<head>
    <title> Color Scheming </title>
</head>
<body>
    <img src="puffin_and_fish.jpg" height="312" width="250" alt="a puffin holding sever fishes in its mouth on a rocky shore">
    <p style="text-size:20px;">© Giles Laurent, gileslaurent.com, License CC BY-SA</p>
<table style="text-align:center;">
    <tr>
        <th colspan="5">Puffin and Fishes</th>
    </tr>
    <tr>
        <td>Color name</td>
        <td >Darkorange</td>
        <td style="background-color:FloralWhite;">FloralWhite</td>
        <td style="background-color:DarkSlateGray;color:white;">DarkSlateGray</td>
        <td style="background-color:Gainsboro;">Gainsboro</td>
    </tr>
    <tr>
        <td>HEX value</td>
        <td>#c76e00</td>
        <td>#fffaf0</td>
        <td>#2f4f4f</td>
        <td>#dcdcdc</td>
    </tr>
    <tr>
        <td>RGB value</td>
        <td>199, 110, 0</td>
        <td>255, 250, 24</td>
        <td>47, 79, 79</td>
        <td>220, 220, 220</td>
    </tr>
    <tr style="text-align:center;">
        <td>HSL value</td>
        <td>33°, 100%, 39%</td>
        <td>40°, 100%, 97%</td>
        <td>180°, 25%, 25%</td>
        <td>0°, 0%, 86%</td>
    </tr>
</table>
</body>
</html>
