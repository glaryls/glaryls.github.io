<!DOCTYPE html>
<html>
<head>
    <title> Color Scheming </title>
</head>
<body>
    <img src="BasicWebDesign/puffin_and_fish.jpg" height="312" width="250" alt="a puffin holding sever fishes in its mouth on a rocky shore">
    <p style="text-size:20px;">© Giles Laurent, gileslaurent.com, License CC BY-SA</p>
<table>
    <tr>
        <th colspan="5" style="text-align:center;">Puffin and Fishes</th>
    </tr>
    <tr>
        <td>Color name</td>
        <td style="background-color:Darkorange;">Darkorange</td>
        <td style="background-color:FloralWhite;">FloralWhite</td>
        <td style="background-color:DarkSlateGray;color:white;">DarkSlateGray</td>
        <td style="background-color:Gainsboro;">Gainsboro</td>
    </tr>
    <tr>
        <td style="text-align:center;">HEX value</td>
        <td style="text-align:center;">#c76e00</td>
        <td style="text-align:center;">#fffaf0</td>
        <td style="text-align:center;">#2f4f4f</td>
        <td style="text-align:center;">#dcdcdc</td>
    </tr>
    <tr>
        <td style="text-align:center;">RGB value</td>
        <td style="text-align:center;">199, 110, 0</td>
        <td style="text-align:center;">255, 250, 24</td>
        <td style="text-align:center;">47, 79, 79</td>
        <td style="text-align:center;">220, 220, 220</td>
    </tr>
    <tr style="text-align:center;">
        <td style="text-align:center;">HSL value</td>
        <td style="text-align:center;">33°, 100%, 39%</td>
        <td style="text-align:center;">
40°, 100%, 97%
</td>
        <td style="text-align:center;">180°, 25%, 25%</td>
        <td style="text-align:center;">0°, 0%, 86%</td>
    </tr>
</table>
</body>
</html>
