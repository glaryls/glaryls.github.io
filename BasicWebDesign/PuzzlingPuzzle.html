<!DOCTYPE html>
<html>
    <head>
        <title>Peculiar Puzzling Puzzle Pieces</title>
        <style>
            body {
                background-color:rgba(230, 130, 150, 0.8);
                font-family:helvetica:
            }
            section.puzzlecontainer { /*beggiigngingng of puzzle*/
                display:flex;
                flex-direction:row;
                justify-content:center;
                min-width:660px;
                max-width:819px;
                margin:auto;
                flex-wrap:wrap;
            }
            div.puzzlepiece {
                border:2px, solid, black;
                height:110px;
                width:150px;
                margin:0px;
            } /* end o' puzzle */
            section.basegrid {
                display:grid;
                grid-template-columns: repeat(3 1fr);
                grid-template:
                'in in .'
                'pz pz pz'
                '. ds ds'
                ;
                border:2px, solid, black;
            }
            div.Intro {
            grid-area:in;
            border:1px black solid;
            }
            div.Puzzle {
            grid-area:pz;
            border:0px solid black;
            }
            div.Desc {
            grid-area:ds;
            border:1px black solid;
            }
        </style>
    </head>
    <body>
        <section class="basegrid">
            
            <div class="Intro">
                this is the intro
            </div>
            
            <div class="Puzzle">
       <section class="puzzlecontainer">
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_A;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_B;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_C;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_D;"></div>
           <!-- ROW 2 -->
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_E;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_F;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_G;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_H;"></div>
           <!-- ROW 3 -->
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_I;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_J;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_K;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_L;"></div>
           <!-- ROW 4 -->
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_M;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_N;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_O;"></div>
           <div class="puzzlepiece" style="background-image:url(/BasicWebDesign/PuzzleBox/puzzle1_P;"></div>
       </section>
       </div>
       
       <div class="Desc">
           this is the description
       </div>
       
       </section>
    </body>
    </html>
