<!DOCTYPE html>
<html><head>
        <title>Peculiar Puzzling Puzzle Pieces</title>
        <style>
               body {
                        background-color:#FFa9ce;
                        
                }
            section.puzzlecontainer { /*beggiigngingng of puzzle*/
                display:flex;
                flex-direction:row;
                justify-content:center;
              
                max-width:700px;
                margin:auto;
                flex-wrap:wrap;
            }
            div.puzzlepiece {
                border:0px, solid, black;
                height:110px;
                width:150px;
                margin:1px;
            } /* end o' puzzle */
            section.basegrid {
                display:grid;
                grid-template-columns: repeat(3 1fr);
                grid-template:
                'in in .'
                'pz pz pz'
                '. ds ds';
                border:0px, black, solid;
                gap:5px;
                
            }
            div.Intro {
            grid-area:in;
            border:1px black solid;
                    background-color:rgba(255,255,255,0.4);
            }
            div.Puzzle {
            grid-area:pz;
            border:1px solid black;
                    background-color:rgba(255,255,255,0.4);
            }
            div.Desc {
            grid-area:ds;
            border:1px black solid;
                    background-color:rgba(255,255,255,0.4);
            }
        </style>
    </head>
